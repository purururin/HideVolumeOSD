name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        platform: [x86, x64]
        configuration: [Release]

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore HideVolumeOSD.sln

    - name: Build project
      run: msbuild HideVolumeOSD\HideVolumeOSDApp.csproj /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:RestorePackages=true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HideVolumeOSD-${{ matrix.platform }}-${{ matrix.configuration }}
        path: ${{ matrix.platform }}/${{ matrix.configuration }}/
        if-no-files-found: error
